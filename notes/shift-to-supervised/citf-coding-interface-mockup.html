<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITF emails: coding interface (mockup)</title>
<style>
:root{
  --bg:#e7ebe9;
  --pane:#f3f5f4;
  --sheet:#fcfcfb;
  --line:#d6dbd8;
  --line-strong:#b9c1bd;
  --ink:#16202b;
  --ink-2:#435060;
  --ink-3:#6b7884;
  --accent:#1d4e6b;
  --slate:#5f6b76;
  --warn:#8a5300;
  --warn-bg:#fbefd6;
  --ok:#23704a;
  --danger:#9b2c2c;
  --agr:#3d4fa0;
  --ops:#12756a;
  --doc:#9a6b0c;
  --coo:#a23a63;
  --oth:#5f6b76;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t-agr{--c:var(--agr);--t:rgba(61,79,160,.16)}
.t-ops{--c:var(--ops);--t:rgba(18,117,106,.17)}
.t-doc{--c:var(--doc);--t:rgba(154,107,12,.2)}
.t-coo{--c:var(--coo);--t:rgba(162,58,99,.16)}
.t-oth{--c:var(--oth);--t:rgba(95,107,118,.16)}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
header.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:9px 16px;background:var(--sheet);border-bottom:1px solid var(--line-strong)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand strong{font-size:15px;font-weight:650}
.brand span{color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12.5px;color:var(--ink-2);background:var(--pane)}
.tag svg{width:14px;height:14px;flex:none}
button.tag{cursor:pointer}
button.tag[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.spacer{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.who{font-size:12.5px;color:var(--ink-2);padding-left:4px}

main{display:grid;grid-template-columns:240px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);min-height:0}
.pane{min-height:0;overflow:auto}
.queue{background:var(--pane);border-right:1px solid var(--line-strong)}
.reader{background:var(--sheet)}
.coder{background:var(--pane);border-left:1px solid var(--line-strong);display:flex;flex-direction:column;overflow:hidden}
.coder .scroll{flex:1;min-height:0;overflow:auto;padding:14px 14px 20px}

.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--lc,var(--ink))}
.lvl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lvl-person{--lc:var(--slate)}
.lvl-mail{--lc:var(--ink)}
.lvl-pass{--lc:var(--accent)}

.qhead{padding:14px 14px 8px}
.qhead h2{margin:0 0 8px;font-size:14px;font-weight:650}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.qi{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px;cursor:pointer}
.qi:hover{background:#eaeeec}
.qi.active{background:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.qstatus{flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:10px;line-height:1;font-weight:700}
.qstatus.coded{background:var(--ok);border-color:var(--ok);color:#fff}
.qstatus.coded::after{content:"\2713"}
.qstatus.flagged{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.qstatus.flagged::after{content:"!"}
.qmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.qsubj{font-weight:560;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qmeta{display:flex;flex-wrap:wrap;gap:0 10px;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.qempty{padding:18px 14px;color:var(--ink-3)}

.msg{max-width:780px;margin:0 auto;padding:24px 34px 120px}
.ids{display:flex;gap:14px;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.msg h1{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.25;margin:8px 0 20px;letter-spacing:-.005em}
.lvlsec{margin:0 0 22px}
.lvlrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px;margin:0 0 8px}
.hintline{color:var(--ink-3);font-size:12.5px}
.hdr{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.hdr dt{color:var(--ink-3);font-size:12.5px;line-height:26px}
.hdr dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;border:1px solid var(--line-strong);background:var(--pane);border-radius:999px;padding:0 11px;font-size:12.5px}
.pid{font-variant-numeric:tabular-nums;font-weight:560}
.prole{color:var(--ink-3)}
.pill.unset{border-style:dashed}
.pill.unset .prole{color:var(--warn)}
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px}
.erow:last-child{margin-bottom:0}
.erow .fl{color:var(--ink-3);font-size:12.5px;margin-right:2px}
.sbtn{height:26px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;padding:0 10px;font-size:12.5px;cursor:pointer}
.sbtn:hover{background:var(--pane)}
.sbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.notein{flex:1;min-width:220px;height:26px;border:1px solid var(--line-strong);border-radius:3px;padding:0 8px;font-size:12.5px;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px;color:var(--ink-3);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c)}
.lg-pii{display:inline-block;font-size:11px;line-height:11px;text-decoration:underline wavy var(--danger);text-underline-offset:3px;color:var(--ink-2)}
.body{font-family:var(--serif);font-size:17.5px;line-height:1.75;max-width:66ch;border-left:3px solid var(--accent);padding-left:18px}
.para{margin:0 0 .95em}
.ph{font-family:var(--mono);font-size:.8em;color:var(--ink-3);background:rgba(22,32,43,.05);border-radius:3px;padding:0 3px}
mark.h-top{color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
mark.h-nocode{background:rgba(155,44,44,.08)}
.h-pii{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:var(--danger);text-decoration-thickness:1.5px;text-underline-offset:6px}
.pend{background:rgba(29,78,107,.14);outline:1.5px dashed var(--accent);outline-offset:1px;border-radius:2px}
[data-apps].link{outline:2px solid var(--ink);outline-offset:1px}
details.thread{margin-top:26px}
details.thread summary{cursor:pointer;color:var(--ink-2);font-size:13px;padding:4px 0}
.quoted{margin-top:8px;border-left:3px solid var(--line);padding:2px 0 2px 16px;color:var(--ink-3);font-family:var(--serif);font-size:15.5px;line-height:1.6;user-select:none;-webkit-user-select:none}
.quoted .qh{font-family:var(--sans);font-size:12.5px;margin-bottom:6px}
.quoted p{margin:0 0 .7em}

/* popover composer: every region has a fixed size, so nothing moves when options change */
.popwrap{position:fixed;z-index:35;width:376px}
.pop-main{background:#fff;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 12px 32px rgba(22,32,43,.24);padding:10px 12px 10px}
.pop-h{display:flex;gap:8px;align-items:flex-start;height:44px;margin-bottom:6px}
.pop-q{flex:1;min-width:0;height:44px;overflow:hidden;font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink-2);border-left:3px solid var(--accent);padding-left:8px}
.range{display:flex;align-items:center;gap:8px;height:28px;margin-bottom:8px}
.range .pl{margin:0}
.rg{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--ink-2)}
.nb{width:26px;height:24px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;cursor:pointer;line-height:1}
.nb:hover{background:var(--pane)}
.pl{display:block;margin:0 0 3px;color:var(--ink-3);font-size:12.5px}
.catrow{height:104px;margin-bottom:8px;overflow:hidden}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px;cursor:pointer}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--slate))}
.chip:hover{border-color:var(--c,var(--slate));background:var(--t,rgba(95,107,118,.12))}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip kbd{font:inherit;font-size:11px;opacity:.65}
.combo{margin-bottom:8px}
.combo input{width:100%;height:32px;border:1px solid var(--accent);border-radius:4px 4px 0 0;padding:0 9px;background:#fff}
.combo input:disabled{border-color:var(--line-strong);background:var(--pane)}
.list{height:132px;border:1px solid var(--line-strong);border-top:0;border-radius:0 0 4px 4px;overflow:auto;background:#fff}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:6px 10px;cursor:pointer}
.opt:hover,.opt.hi{background:#eef3f6}
.opt em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--warn)}
.opt.create{color:var(--accent);font-weight:560}
.opt-note{padding:8px 10px;color:var(--ink-3);font-size:12.5px}
.opt .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--slate))}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.pop-foot{display:flex;flex-direction:column;gap:4px}
.keys{color:var(--ink-3);font-size:12px}
.current{height:24px;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-size:13px}
.current .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c,var(--slate))}
.current strong{font-weight:650}
.current .cur-empty{color:var(--ink-3)}
.current .sp{flex:1}
.current .rm{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline;cursor:pointer}
.pickplace{height:104px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-3);font-size:12.5px;background:var(--pane);border-radius:4px;padding:0 24px}

.applied-h{margin:0 0 6px}
.applied-h h3{margin:0;font-size:14px;font-weight:650}
.sum{margin:0;padding:0;font-size:12.5px}
.sum div{display:flex;gap:8px;padding:1px 0}
.sum dt{flex:none;width:84px;color:var(--ink-3)}
.sum dd{margin:0}
.blk{margin:0 0 16px;border-top:2px solid var(--lc,var(--ink));padding-top:6px}
.blk-person{--lc:var(--slate)}
.blk-mail{--lc:var(--ink)}
.blk-pass{--lc:var(--accent)}
.blk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-bottom:6px}
.blk-hint{color:var(--ink-3);font-size:12.5px}
.ent{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,var(--slate));border-radius:0 3px 3px 0;padding:7px 8px 6px 10px;margin-bottom:6px}
.ent.nocode{--c:var(--danger)}
.ent.link{background:#eef3f6}
.etop{display:flex;align-items:flex-start;gap:6px}
.eleft{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.eright{flex:none;display:flex}
.eleft strong{font-weight:650}
.axis{border:1px solid var(--line-strong);border-radius:3px;padding:0 6px;font-size:11.5px;color:var(--ink-2);background:var(--pane)}
.eq{margin:4px 0 2px;font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}
.minis{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px}
.mini{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;cursor:pointer}
.blk-empty{color:var(--ink-3);font-size:12.5px;padding:2px 0 4px}
table.roles{width:100%;border-collapse:collapse}
.roles td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.roles td:first-child{width:34%;padding-right:8px}
.roles td small{display:block;color:var(--ink-3);font-size:12px}
.roles small.need{color:var(--warn)}
.roles select{width:100%;border:1px solid var(--line-strong);border-radius:4px;padding:4px 6px;background:#fff}
.icon{flex:none;width:24px;height:24px;border:0;border-radius:3px;background:transparent;color:var(--ink-3);cursor:pointer;line-height:1}
.icon:hover{background:var(--pane);color:var(--ink)}
.btn{border:1px solid var(--line-strong);background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--pane)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#17405a}
.btn:disabled{opacity:.45;cursor:not-allowed}

.foot{border-top:1px solid var(--line-strong);background:var(--sheet);padding:10px 14px 12px}
.probs{margin:0 0 6px;padding-left:18px;color:var(--warn);font-size:12.5px}
.ready{margin:0 0 6px;color:var(--ok);font-size:12.5px}
.soft{margin:0 0 8px;padding-left:18px;color:var(--ink-3);font-size:12.5px}
.fa{display:flex;gap:8px;justify-content:space-between}
.kbd{margin:8px 0 0;color:var(--ink-3);font-size:12px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:8px 14px;border-radius:5px;font-size:13px;transition:opacity .15s,transform .15s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:rgba(22,32,43,.34);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--sheet);z-index:41;transform:translateX(102%);visibility:hidden;transition:transform .18s,visibility 0s .18s;box-shadow:-10px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .18s}
.dhead{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dhead .row{display:flex;justify-content:space-between;align-items:center}
.dhead h2{margin:0;font-size:16px}
.dhead p{margin:6px 0 10px;color:var(--ink-3);font-size:12.5px}
.dhead input{width:100%;border:1px solid var(--line-strong);border-radius:4px;padding:5px 8px;background:var(--pane)}
.dbody{flex:1;overflow:auto;padding:6px 18px 30px}
.cb-theme h3{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-size:14px;color:var(--c,var(--ink))}
.cb-theme h3 i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--slate))}
.cb{border-left:3px solid var(--c,var(--slate));padding:2px 0 2px 12px;margin:0 0 12px}
.cb h4{margin:0;font-size:13.5px}
.cb p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.cb .not,.cb .anc{color:var(--ink-3)}
.cb.flash{background:var(--t,#eef3f6)}
.cb .newtag{margin-left:8px;font-size:11.5px;font-weight:400;color:var(--warn)}
.cb .defin{width:100%;margin-top:4px;border:1px solid var(--line-strong);border-radius:4px;padding:4px 7px}

@media (max-width:1180px){main{grid-template-columns:210px minmax(0,1fr) 330px}.msg{padding:22px 22px 120px}}
@media (max-width:900px){
  body{overflow:auto}
  .app{display:block;height:auto}
  main{display:block}
  .pane,.coder{overflow:visible}
  .queue{border-right:0;border-bottom:1px solid var(--line-strong)}
  .coder{border-left:0;border-top:1px solid var(--line-strong)}
  .coder .scroll{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><strong>CITF emails</strong><span>Manual coding</span></div>
    <span class="tag">Codebook v0.4 draft</span>
    <span class="tag">Calibration round 1</span>
    <button class="tag" id="btnFreeze" aria-pressed="false" title="Switch to simulate the codebook freeze before the double-coded sample">New codes allowed</button>
    <span class="tag" title="Annotators do not see NMF topics or model predictions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a19.7 19.7 0 0 1 5.1-5.9M9.9 4.2A10.6 10.6 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>
      NMF topics and model predictions are hidden
    </span>
    <div class="spacer"></div>
    <div class="progress"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>
    <button class="btn small" id="btnCodebook">Codebook</button>
    <button class="btn small" id="btnExport">Export JSON</button>
    <span class="who">Coder A</span>
  </header>
  <main>
    <nav class="pane queue" aria-label="Email queue">
      <div class="qhead">
        <h2>Calibration round 1</h2>
        <div class="seg" id="filters" role="group" aria-label="Filter emails">
          <button data-filter="all" aria-pressed="true">All</button>
          <button data-filter="todo" aria-pressed="false">To do</button>
          <button data-filter="flagged" aria-pressed="false">Flagged</button>
        </div>
      </div>
      <div id="queueList"></div>
    </nav>
    <section class="pane reader" id="reader" aria-label="Email"></section>
    <aside class="pane coder" aria-label="Review">
      <div class="scroll" id="coderScroll"></div>
      <div class="foot" id="foot"></div>
    </aside>
  </main>
</div>

<div id="pop" class="popwrap" role="dialog" aria-label="Code this passage" hidden></div>
<div id="toast" class="toast" role="status"></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Codebook" aria-hidden="true"></aside>

<script>
(() => {
'use strict';

/* ---------- codebook (example text for the mockup) ---------- */
const THEMES = {
  agr:{name:'Agreements and contracts'},
  ops:{name:'Data operations'},
  doc:{name:'Study documentation'},
  coo:{name:'Coordination'},
  oth:{name:'Other'}
};
const TC = {
  agr:{c:'#3d4fa0',t:'rgba(61,79,160,.2)'},
  ops:{c:'#12756a',t:'rgba(18,117,106,.2)'},
  doc:{c:'#9a6b0c',t:'rgba(154,107,12,.22)'},
  coo:{c:'#a23a63',t:'rgba(162,58,99,.2)'},
  oth:{c:'#5f6b76',t:'rgba(95,107,118,.2)'}
};
const ROLE_DOMAINS = {core:'CITF core', dc:'Data contributors', inst:'Institutional'};

const book = {
  topic:[
    {id:'gov',theme:'agr',name:'Data governance',def:'Rules, policies, or authority over who may hold, access, or share the data.',not:'The negotiation or status of a specific agreement. Use Data sharing agreements.'},
    {id:'reb',theme:'agr',name:'Ethics review',def:'Ethics board submissions, approvals, renewals, and their requirements.'},
    {id:'dsa',theme:'agr',name:'Data sharing agreements',def:'Drafting, negotiating, reviewing, signing, or tracking a data sharing agreement.',not:'General rules about data access. Use Data governance.',anchor:'“Attached is our revised agreement with the changes from legal.”'},

/* ---------- reader ---------- */
function paraHTML(i, text){
  const e = cur();
  const items = e.passages.filter(p => p.para === i);
  const pend = state.pop && state.pop.passage.para === i ? state.pop.passage : null;
  const cuts = new Set([0, text.length]);
  items.forEach(p => { cuts.add(p.start); cuts.add(p.end); });
  if (pend){ cuts.add(pend.start); cuts.add(pend.end); }
  const pts = [...cuts].sort((a, b) => a - b);
  let out = '';
  for (let k = 0; k < pts.length - 1; k++){
    const s = pts[k], t = pts[k + 1]; if (t <= s) continue;
    const p = items.find(x => x.start <= s && x.end >= t);
    const isPend = pend && pend.start <= s && pend.end >= t;
    let inner = ph(text.slice(s, t));
    if (p){
      if (p.code){
        const col = TC[tOf(p.code).theme];
        inner = '<mark class="h-top' + (p.pii ? ' h-pii' : '') + '" data-apps="' + p.id + '" style="background:' + col.t + ';box-shadow:inset 0 -3px 0 ' + col.c + '">' + inner + '</mark>';
      } else inner = '<mark class="h-top h-nocode h-pii" data-apps="' + p.id + '">' + inner + '</mark>';
    }
    if (isPend) inner = '<span class="pend">' + inner + '</span>';
    out += inner;
  }
  return out;
}

function go(i){ closePop(true); state.idx = i; renderAll(); $('#coderScroll').scrollTop = 0; $('#reader').scrollTop = 0; }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400);
}
function nextOpen(){
  for (let k = 1; k <= emails.length; k++){ const j = (state.idx + k) % emails.length; if (emails[j].status === 'todo') return j; }
  return -1;
}

/* ---------- the popover composer ---------- */
function openPop(range){
  state.pop = {passage:{para:range.para, start:range.start, end:range.end}, anchorSel:'.pend', cat:null, q:'', hi:-1, unsure:false};
  renderReader(); renderPop();
}
function closePop(silent){
  if (!state.pop) return;
  state.pop = null; $('#pop').hidden = true;
  if (!silent) renderReader();
}
const cats = () => Object.keys(THEMES).map(k => ({id:k, name:THEMES[k].name, cls:'t-' + k}));
const comboVisible = () => !!state.pop.cat;
function options(){
  if (!comboVisible()) return [];
  const p = state.pop, q = norm(p.q), all = book.topic.filter(x => x.theme === p.cat);
  const rank = x => { const n = norm(x.name); return n === q ? 0 : (n.startsWith(q) ? 1 : 2); };
  const list = all.filter(x => !q || norm(x.name).includes(q)).sort((a, b) => q ? rank(a) - rank(b) : 0).map(x => ({type:'code', x}));
  if (q && !all.some(x => norm(x.name) === q) && !state.frozen) list.push({type:'create'});
  return list;
}
function fillList(){
  const host = $('#pList'); if (!host) return;
  const p = state.pop, opts = options(), q = norm(p.q);
  let html;
  if (!comboVisible()) html = '<div class="opt-note">Choose a category to see its codes.</div>';
  else if (!opts.length) html = q && state.frozen ? '<div class="opt-note">No match. New codes are off while the codebook is frozen.</div>' : '<div class="opt-note">No codes here yet. Type a name to create one.</div>';
  else html = opts.map((o, i) => o.type === 'code'
    ? '<button class="opt t-' + o.x.theme + (i === p.hi ? ' hi' : '') + '" data-pa="opt" data-code="' + esc(o.x.id) + '"><span class="dot"></span>' + esc(o.x.name) + (o.x.provisional ? '<em>new</em>' : '') + '</button>'
    : '<button class="opt create' + (i === p.hi ? ' hi' : '') + '" data-pa="create">Create “' + esc(p.q.trim()) + '” in ' + esc(THEMES[p.cat].name) + '</button>').join('');
  host.innerHTML = html;
}
function focusCombo(){ setTimeout(() => { const i = $('#pIn'); if (i && !i.disabled){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); }

function currentHTML(ps){
  if (!ps || !ps.code) return '<span class="cur-empty">Not yet coded.</span>';
  const o = tOf(ps.code);
  return '<span class="dot t-' + o.theme + '"></span><strong>' + esc(o.name) + '</strong><span class="hintline">' + esc(THEMES[o.theme].name) + '</span>' +
    '<span class="sp"></span><button class="rm" data-pa="rm-code">Remove</button>';
}
function rgHTML(label, edge){
  return '<span class="rg">' + label +
    '<button class="nb" data-pa="nudge" data-edge="' + edge + '" data-dir="-1" title="Move the ' + edge + ' one word to the left" aria-label="Move the ' + edge + ' one word to the left">◂</button>' +
    '<button class="nb" data-pa="nudge" data-edge="' + edge + '" data-dir="1" title="Move the ' + edge + ' one word to the right" aria-label="Move the ' + edge + ' one word to the right">▸</button></span>';
}
function renderPop(){
  const e = cur(), p = state.pop, host = $('#pop');
  if (!p){ host.hidden = true; return; }
  const ps = findP(e, p.passage);
  const text = e.paras[p.passage.para].slice(p.passage.start, p.passage.end);
  const unsure = ps && ps.code ? ps.unsure : p.unsure;
  let h = '<div class="pop-main">';
  h += '<div class="pop-h"><div class="pop-q">“' + esc(text) + '”</div><button class="icon" data-pa="close" aria-label="Close" title="Close (Esc)">×</button></div>';
  h += '<div class="range"><span class="pl">Range</span>' + rgHTML('Start', 'start') + rgHTML('End', 'end') + '</div>';
  h += '<div class="current">' + currentHTML(ps) + '</div>';
  const hasCode = !!(ps && ps.code);
  if (hasCode){
    h += '<div class="pickplace">Remove the code above to choose a different one.</div>';
  } else {
    h += '<div class="catrow"><span class="pl">Category</span><div class="chips">' + cats().map((k, i) => '<button class="chip ' + k.cls + '" data-pa="cat" data-v="' + k.id + '" aria-pressed="' + (p.cat === k.id) + '">' + esc(k.name) + ' <kbd>' + (i + 1) + '</kbd></button>').join('') + '</div></div>';
    h += '<div class="combo"><label class="pl" for="pIn">' + (p.cat ? 'Find or create a code in ' + esc(THEMES[p.cat].name) : 'Find or create a code') + '</label>' +
      '<input id="pIn" type="text" autocomplete="off" data-role="combo" value="' + esc(p.q) + '"' + (comboVisible() ? '' : ' disabled') + ' placeholder="' + (comboVisible() ? 'Type to search. Press Enter to choose.' : 'Choose a category first') + '">' +
      '<div class="list" id="pList"></div></div>';
  }
  h += '<div class="pop-foot"><label class="check"><input type="checkbox" data-pa="unsure-new"' + (unsure ? ' checked' : '') + (ps && ps.code ? '' : ' disabled') + '> Unsure about this coding</label>' +
    '<label class="check"><input type="checkbox" data-pa="pii-new"' + (ps && ps.pii ? ' checked' : '') + '> Contains identifying information</label>' +
    '<span class="keys">' + (hasCode ? 'Remove the code above to choose another. Esc closes.' : '1 to 5 pick a category. A passage takes one code. Esc closes.') + '</span></div></div>';
  host.innerHTML = h; host.hidden = false;
  fillList(); positionPop();
}
function positionPop(){
  const p = state.pop, host = $('#pop'); if (!p || host.hidden) return;
  const el = document.querySelector(p.anchorSel);
  if (!el) return;
  const r = el.getBoundingClientRect(), w = 376, hh = host.querySelector('.pop-main').offsetHeight;
  const left = Math.min(Math.max(8, r.left), Math.max(8, innerWidth - w - 8));
  let top = r.bottom + 8;
  if (top + hh > innerHeight - 8) top = r.top - hh - 8;
  host.style.left = left + 'px'; host.style.top = Math.max(8, top) + 'px';
}
$('#reader').addEventListener('scroll', () => requestAnimationFrame(positionPop));
window.addEventListener('resize', positionPop);

function dropIfEmpty(e, ps){ if (!ps.code && !ps.pii) e.passages = e.passages.filter(x => x !== ps); }
function applyCode(codeId){
  const e = cur(), p = state.pop;
  let ps = findP(e, p.passage);
  if (ps && ps.code === codeId){ toast('Already coded that way.'); return; }
  const prev = ps && ps.code ? codeName('topic', ps.code) : null;
  const unsure = ps && ps.code ? ps.unsure : p.unsure;
  if (ps){ ps.code = codeId; ps.unsure = unsure; }
  else e.passages.push({id:uid(), para:p.passage.para, start:p.passage.start, end:p.passage.end, code:codeId, unsure:p.unsure, pii:false});
  if (prev) toast('Replaced ' + prev + '. A passage takes one code.');
  p.cat = null; p.q = ''; p.hi = -1; p.unsure = false;
  renderAfterChange();
}
function createCode(){
  const p = state.pop, name = p.q.trim();
  if (!name || state.frozen || !p.cat) return;
  const obj = {id:'n' + (++state.newN) + '_' + slug(name), theme:p.cat, name, def:'', provisional:true, from:cur().id};
  book.topic.push(obj);
  applyCode(obj.id);
}
function nudge(edge, dir){
  const e = cur(), p = state.pop; if (!p) return;
  const t = e.paras[p.passage.para], old = {...p.passage};
  let s = old.start, en = old.end, i;
  if (edge === 'start'){
    if (dir < 0){ i = s; while (i > 0 && !isW(t[i - 1])) i--; while (i > 0 && isW(t[i - 1])) i--; s = i; }
    else { i = s; while (i < en && isW(t[i])) i++; while (i < en && !isW(t[i])) i++; s = i; }
  } else {
    if (dir > 0){ i = en; while (i < t.length && !isW(t[i])) i++; while (i < t.length && isW(t[i])) i++; en = i; }
    else { i = en; while (i > s && !isW(t[i - 1])) i--; while (i > s && isW(t[i - 1])) i--; while (i > s && !isW(t[i - 1])) i--; en = i; }
  }
  if (en <= s){ toast('The range cannot be empty.'); return; }
  const np = {para:old.para, start:s, end:en}, ps = findP(e, old);
  if (overlapping(e, np, ps ? ps.id : null)){ toast('That would overlap another passage.'); return; }
  if (ps){ ps.start = s; ps.end = en; }
  p.passage = np; renderAfterChange();
}

const pop = $('#pop');
pop.addEventListener('click', ev => {
  const el = ev.target.closest('[data-pa]'); if (!el) return;
  const p = state.pop, e = cur(), act = el.dataset.pa, ps = findP(e, p.passage);
  if (act === 'close'){ closePop(); return; }
  if (act === 'cat'){ p.cat = p.cat === el.dataset.v ? null : el.dataset.v; p.q = ''; p.hi = -1; renderPop(); if (p.cat) focusCombo(); return; }
  if (act === 'nudge'){ nudge(el.dataset.edge, +el.dataset.dir); return; }
  if (act === 'opt'){ applyCode(el.dataset.code); return; }
  if (act === 'create'){ createCode(); return; }
  if (act === 'rm-code' && ps){ ps.code = null; ps.unsure = false; p.unsure = false; dropIfEmpty(e, ps); renderAfterChange(); return; }
});
pop.addEventListener('change', ev => {
  const el = ev.target.closest('[data-pa]'); if (!el) return;
  const p = state.pop, e = cur(), act = el.dataset.pa; let ps = findP(e, p.passage);
  if (act === 'unsure-new'){ if (ps && ps.code){ ps.unsure = el.checked; renderApplied(); renderPop(); } else p.unsure = el.checked; }
  if (act === 'pii-new'){
    if (el.checked){
      if (ps) ps.pii = true;
      else e.passages.push({id:uid(), para:p.passage.para, start:p.passage.start, end:p.passage.end, code:null, unsure:false, pii:true});
    } else if (ps){ ps.pii = false; dropIfEmpty(e, ps); }
    renderAfterChange();
  }
});
pop.addEventListener('input', ev => {
  if (ev.target.dataset.role !== 'combo') return;
  const p = state.pop; p.q = ev.target.value; p.hi = p.q.trim() && options().length ? 0 : -1; fillList();
});
pop.addEventListener('keydown', ev => {
  if (ev.target.dataset.role !== 'combo') return;
  const p = state.pop, opts = options();
  if (ev.key === 'ArrowDown'){ ev.preventDefault(); if (opts.length){ p.hi = (p.hi + 1) % opts.length; fillList(); } }
  else if (ev.key === 'ArrowUp'){ ev.preventDefault(); if (opts.length){ p.hi = (p.hi - 1 + opts.length) % opts.length; fillList(); } }
  else if (ev.key === 'Enter'){
    ev.preventDefault();
    if (p.hi < 0 && !p.q.trim()) return;
    const pick = opts[Math.max(p.hi, 0)];
    if (pick){ if (pick.type === 'code') applyCode(pick.x.id); else createCode(); }
  } else if (ev.key === 'Escape'){ ev.stopPropagation(); p.cat = null; p.q = ''; p.hi = -1; renderPop(); }
});

/* ---------- reader interactions ---------- */
function capturePassage(){
  const sel = getSelection(), body = $('#body');
  if (!body || !sel || !sel.rangeCount || sel.isCollapsed) return false;
  let r = sel.getRangeAt(0);
  if (!body.contains(r.commonAncestorContainer)) return false;
  const pOf = n => n && (n.nodeType === 3 ? n.parentElement : n).closest('.para');
  const p1 = pOf(r.startContainer);
  let p2 = pOf(r.endContainer);
  if (p1 && p2 && p1 !== p2 && r.endOffset === 0){ const r2 = r.cloneRange(); r2.setEnd(p1, p1.childNodes.length); r = r2; p2 = p1; }
  if (!p1 || !p2) return false;
  if (p1 !== p2){ toast('Select within one paragraph.'); return false; }
  const pre = document.createRange(); pre.selectNodeContents(p1); pre.setEnd(r.startContainer, r.startOffset);
  const text = r.toString(), full = p1.textContent;
  let start = pre.toString().length, end = start + text.length;
  start += text.length - text.replace(/^\s+/, '').length;
  end -= text.length - text.replace(/\s+$/, '').length;
  if (end <= start) return false;
  while (start > 0 && isW(full[start - 1]) && isW(full[start])) start--;
  while (end < full.length && isW(full[end]) && isW(full[end - 1])) end++;
  const rng = {para:+p1.dataset.i, start, end};
  sel.removeAllRanges();
  if (overlapping(cur(), rng) && !findP(cur(), rng)){ toast('That selection overlaps a coded passage. Select its highlight to edit it, or move its edges.'); return true; }
  openPop(rng);
  return true;
}
function editHighlight(el){
  const ps = cur().passages.find(x => x.id === el.dataset.apps);
  if (ps) openPop({para:ps.para, start:ps.start, end:ps.end});
}
$('#reader').addEventListener('mouseup', ev => {
  const inBody = !!ev.target.closest('#body');
  const hl = ev.target.closest('[data-apps]');
  setTimeout(() => {
    if (capturePassage()) return;
    if (!inBody) return;
    const s = getSelection();
    if (s && !s.isCollapsed) return;
    if (hl && document.body.contains(hl)) editHighlight(hl);
    else if (state.pop) closePop();
  }, 0);
});
$('#reader').addEventListener('keyup', ev => { if (ev.shiftKey || /^Arrow/.test(ev.key)) setTimeout(capturePassage, 0); });
$('#reader').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b){ if (state.pop && !ev.target.closest('#body') && !ev.target.closest('input')) closePop(); return; }
  const e = cur();
  if (b.dataset.act === 'exclude'){
    const was = e.exclude;
    e.exclude = was === b.dataset.v ? null : b.dataset.v;
    if (e.exclude && e.passages.length){ e.passages = []; toast('Cleared ' + (was ? '' : 'the ') + 'coded passages. ' + e.exclude + ' replaces them.'); }
    renderAfterChange();
  }
});
$('#reader').addEventListener('input', ev => { if (ev.target.dataset.role === 'note'){ cur().note = ev.target.value; renderFoot(); } });

/* ---------- review pane and footer ---------- */
$('#coderScroll').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const e = cur(), act = el.dataset.act;
  if (act === 'rmp'){
    const ps = e.passages.find(x => x.id === el.dataset.id); if (!ps) return;
    if (ps.code){ ps.code = null; ps.unsure = false; dropIfEmpty(e, ps); } else { e.passages = e.passages.filter(x => x !== ps); }
    renderAfterChange();
  } else if (act === 'info') openDrawer(el.dataset.code);
});
$('#coderScroll').addEventListener('change', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const e = cur(), act = el.dataset.act;
  if (act === 'unsure'){ const ps = e.passages.find(x => x.id === el.dataset.id); if (ps) ps.unsure = el.checked; renderAfterChange(); }
  if (act === 'pii'){ const ps = e.passages.find(x => x.id === el.dataset.id); if (ps){ ps.pii = el.checked; dropIfEmpty(e, ps); } renderAfterChange(); }
  if (act === 'role'){
    const k = el.dataset.key;
    if (el.value) roleMap[k] = {role:el.value, since:e.date}; else delete roleMap[k];
    renderReader(); renderApplied(); renderFoot();
  }
});
function saveEmail(){
  const e = cur();
  if (validate(e).length){ toast('Finish the items listed under Review before saving.'); return; }
  e.status = 'coded'; toast('Saved ' + e.id + '.');
  const j = nextOpen();
  if (j >= 0) go(j); else { renderAll(); toast('All emails in this round are coded.'); }
}
$('#foot').addEventListener('click', ev => {
  const act = ev.target.closest('[data-act]'); if (!act) return;
  const e = cur();
  if (act.dataset.act === 'save') saveEmail();
  else if (act.dataset.act === 'flag'){
    e.status = 'flagged'; toast('Flagged ' + e.id + ' for adjudication.');
    const j = nextOpen();
    if (j >= 0 && j !== state.idx) go(j); else renderAll();
  }
});
$('#queueList').addEventListener('click', ev => { const b = ev.target.closest('.qi'); if (b) go(+b.dataset.i); });
$('#filters').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b){ state.filter = b.dataset.filter; renderQueue(); } });
$('#btnFreeze').addEventListener('click', () => { state.frozen = !state.frozen; renderHeader(); if (state.pop) renderPop(); toast(state.frozen ? 'Codebook frozen. New codes are off.' : 'New codes are allowed again.'); });

document.addEventListener('mouseover', ev => {
  const sp = ev.target.closest('[data-apps]'), en = ev.target.closest('.ent');
  const id = sp ? sp.dataset.apps : (en ? en.dataset.app : null);
  document.querySelectorAll('.link').forEach(n => n.classList.remove('link'));
  if (id) document.querySelectorAll('[data-apps="' + id + '"], .ent[data-app="' + id + '"]').forEach(n => n.classList.add('link'));
});

/* ---------- codebook drawer ---------- */
function cbEntry(ns, c){
  return '<article class="cb" id="cb-' + ns + '-' + esc(c.id.replace(/[^A-Za-z0-9_-]/g, '_')) + '" data-q="' + esc((c.name + ' ' + (c.def || '')).toLowerCase()) + '"><h4>' + esc(c.name) +
    (c.provisional ? '<span class="newtag">New in ' + c.from + '</span>' : '') + '</h4>' +
    (c.provisional && !c.def ? '<input class="defin" data-defkey="' + ns + '|' + esc(c.id) + '" placeholder="Add a definition">' : (c.def ? '<p>' + esc(c.def) + '</p>' : '')) +
    (c.not ? '<p class="not"><b>Not this.</b> ' + esc(c.not) + '</p>' : '') +
    (c.anchor ? '<p class="anc"><b>Anchor example.</b> ' + esc(c.anchor) + '</p>' : '') + '</article>';
}
function renderDrawer(){
  const topics = Object.keys(THEMES).map(t => '<section class="cb-theme t-' + t + '"><h3><i></i>' + THEMES[t].name + '</h3>' + book.topic.filter(c => c.theme === t).map(c => cbEntry('topic', c)).join('') + '</section>').join('');
  const roles = Object.keys(ROLE_DOMAINS).map(d => '<section class="cb-theme"><h3><i></i>Roles: ' + ROLE_DOMAINS[d] + '</h3>' + book.role.filter(c => c.domain === d).map(c => cbEntry('role', c)).join('') + '</section>').join('');
  const eflags = '<section class="cb-theme"><h3><i></i>Flags: in place of coding the email</h3>' + EMAIL_FLAGS.map(f => '<article class="cb"><h4>' + f.name + '</h4><p>' + esc(f.def) + '</p></article>').join('') + '</section>';
  const pflags = '<section class="cb-theme"><h3><i></i>Flags: on a passage or a coding</h3>' + PASSAGE_FLAGS.map(f => '<article class="cb"><h4>' + f.name + '</h4><p>' + esc(f.def) + '</p></article>').join('') + '</section>';
  $('#drawer').innerHTML =
    '<div class="dhead"><div class="row"><h2>Codebook</h2><button class="btn small" data-close>Close</button></div>' +
    '<p>Example text for this mockup. The full codebook will be larger. Codes created while coding appear here marked New until they get a definition and a review.</p>' +
    '<input type="search" id="cbSearch" placeholder="Filter codes" aria-label="Filter codes"></div>' +
    '<div class="dbody" id="dbody">' + topics + roles + eflags + pflags + '</div>';
}
function openDrawer(id){
  renderDrawer();
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').hidden = false;
  if (id){
    const el = document.getElementById('cb-topic-' + id.replace(/[^A-Za-z0-9_-]/g, '_'));
    if (el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
  }
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').hidden = true; }
$('#drawer').addEventListener('click', ev => { if (ev.target.closest('[data-close]')) closeDrawer(); });
$('#drawer').addEventListener('input', ev => {
  if (ev.target.id !== 'cbSearch') return;
  const q = ev.target.value.trim().toLowerCase();
  document.querySelectorAll('#dbody .cb').forEach(a => { a.hidden = q && a.dataset.q && !a.dataset.q.includes(q); });
  document.querySelectorAll('#dbody .cb-theme').forEach(s => { s.hidden = !s.querySelector('.cb:not([hidden])'); });
});
$('#drawer').addEventListener('change', ev => {
  const k = ev.target.dataset.defkey; if (!k) return;
  const [ns, id] = k.split('|'), c = codeObj(ns, id); if (c) c.def = ev.target.value.trim();
});
$('#btnCodebook').addEventListener('click', () => openDrawer());
$('#scrim').addEventListener('click', closeDrawer);

/* ---------- export ---------- */
$('#btnExport').addEventListener('click', () => {
  const data = emails.map(e => {
    return {
      id:e.id, study:e.study, date:e.date, status:e.status, exclude:e.exclude, note:e.note,
      passages:e.passages.map(p => ({
        text:e.paras[p.para].slice(p.start, p.end), paragraph:p.para, start:p.start, end:p.end,
        category:p.code ? THEMES[tOf(p.code).theme].name : null, code:p.code ? codeName('topic', p.code) : null,
        unsure:p.unsure, identifying_information:p.pii
      })),
      roles:Object.fromEntries(e.people.map(pp => [pp.p, (roleMap[roleKey(pp.p, e.study)] || {}).role || null]))
    };
  });
  const provisional = book.topic.filter(c => c.provisional).map(c => ({category:THEMES[c.theme].name, name:c.name, definition:c.def || null, created_in:c.from}));
  const blob = new Blob([JSON.stringify({codebook:'v0.4-draft', coder:'A', new_codes:provisional, emails:data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'citf-emails-coding.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Exported the current codings.');
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter'){ ev.preventDefault(); saveEmail(); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === 'Escape'){ if ($('#drawer').classList.contains('open')) closeDrawer(); else closePop(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  if (state.pop && /^[1-9]$/.test(ev.key)){
    const ps = findP(cur(), state.pop.passage);
    if (ps && ps.code) return;
    const c = cats()[+ev.key - 1];
    if (c){ state.pop.cat = c.id; state.pop.q = ''; state.pop.hi = -1; renderPop(); focusCombo(); }
    return;
  }
  if (ev.key === 'n' || ev.key === 'N') go(Math.min(emails.length - 1, state.idx + 1));
  if (ev.key === 'p' || ev.key === 'P') go(Math.max(0, state.idx - 1));
});

renderAll();
})();
</script>
