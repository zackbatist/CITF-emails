project:
  type: website
  title: CITF Emails Analysis
  preview:
    port: 7777
    browser: false
  render: 
    - "*.qmd"
    - "**/*.qmd"
    - "!private/" # Internal docs
    - "!**/sections/" # Section files are included in each index.qmd, not pages of their own
    - "!**/*.ipynb" # Notebooks hold email text in their outputs
    - "!**/_*.qmd" # Personal records and fragments, included by their index.qmd
website: 
  site-url: https://zackbatist.info/CITF-emails/
  repo-url: https://github.com/zackbatist/CITF-emails
  repo-actions: none
  bread-crumbs: true
  page-navigation: false
  back-to-top-navigation: false
  page-footer:
    right: "This page is built with ❤️ and [Quarto](https://quarto.org/)."
    # left:
    #   - text: "CC0"
    #     href: https://creativecommons.org/publicdomain/zero/1.0/
  sidebar:
    # logo: "images/logo.png"
    pinned: true
    align: center
    style: docked
    search: false
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - href: topic-modelling/index.qmd
        text: Topic Modelling
      - href: research-protocol/index.qmd
        text: Research Protocol
      - section: Corpus
        contents:
          - href: corpus/tests/zoning/index.qmd
            text: Zoning
      - section: Coding
        contents:
          - section: Rhetoric
            contents:
              - href: coding/rhetoric/tests/docuscope/index.qmd
                text: DocuScope Assessment
      - section: Notes
        href: notes/index.qmd
        contents:
          - href: notes/study-design/index.qmd
            text: Study Design
          - href: notes/relating-rhetoric-to-functions/index.qmd
            text: Relating Rhetoric to Functions
          - href: notes/shift-to-supervised/index.qmd
            text: Shifting to Supervised Topic Assignment
          - href: notes/rhetorical-groups/index.qmd
            text: Deriving Rhetorical Groups from Linguistic Features
toc: true
toc-depth: 3
toc-expand: 2
number-sections: true
format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    page-layout: article
    grid:
      body-width: 1000px
    include-in-header:
      - text: |
          <style type="text/css">
          p {
            text-align: justify !important;
          }
          </style>
filters:
  - quarto
  # - assets/collect-citekeys.lua
execute:
  echo: false
  message: false
  warning: false
  freeze: true